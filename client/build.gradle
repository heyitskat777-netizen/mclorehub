plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.21' }
group = 'net.mclorehub'
version = '1.0.2'
base { archivesName = 'mclorehub' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
loom {
    def platformTrust = providers.environmentVariable('MCLOREHUB_TRUSTSTORE')
    runs.configureEach {
        if (platformTrust.isPresent()) vmArg "-Djavax.net.ssl.trustStore=${platformTrust.get()}"
    }
    splitEnvironmentSourceSets()
    mods {
        mclorehub {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}
dependencies {
    implementation project(':')
    include project(':')
    include 'org.jsoup:jsoup:1.21.2'
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
}
dependencyLocking { lockAllConfigurations() }
tasks.withType(net.fabricmc.loom.task.DownloadAssetsTask).configureEach { downloadThreads = 8 }
tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mclorehub-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}
